<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Presence</title>
  </head>
  <body>
    <main id="app" aria-label="Presence infinite canvas">
      <div id="sceneRoot" aria-hidden="true"></div>

      <header class="mobile-frame">
        <p class="brand">Presence</p>
        <nav class="top-actions" aria-label="工具">
          <button id="resetView" class="icon-button" type="button" aria-label="重置视角">↺</button>
          <div class="mode-switch" role="group" aria-label="模式选择">
            <button id="choiceModeToggle" class="mode-option active" type="button">选择</button>
            <button id="journalModeToggle" class="mode-option" type="button">记录</button>
          </div>
          <button id="cardSetToggle" class="icon-button" type="button" aria-label="卡组">
            <span class="cards-icon" aria-hidden="true"></span>
          </button>
          <button id="calendarToggle" class="icon-button" type="button" aria-label="日历">
            <span class="calendar-icon" aria-hidden="true"></span>
          </button>
          <button id="weatherToggle" class="icon-button weather-button active" type="button" aria-label="最近漂来的碎片">
            <span class="weather-icon" aria-hidden="true"></span>
          </button>
        </nav>
      </header>

      <aside class="side-panel" id="cardSetPanel" aria-hidden="true">
        <div class="panel-head">
          <p class="panel-title">卡牌套组</p>
          <button id="closeCardSetPanel" class="icon-button" type="button" aria-label="关闭卡组">×</button>
        </div>
        <input id="photoInput" class="visually-hidden" type="file" accept="image/*" capture="environment" multiple />
        <div id="cardSetList" class="set-list"></div>
      </aside>

      <aside class="side-panel calendar-panel" id="calendarPanel" aria-hidden="true">
        <div class="panel-head">
          <button id="closeCalendarPanel" class="icon-button" type="button" aria-label="关闭日历">×</button>
        </div>
        <div id="calendarList" class="calendar-list"></div>
      </aside>

      <section class="calendar-review" id="calendarReview" aria-hidden="true">
        <div class="calendar-review-scrim" id="calendarReviewScrim"></div>
        <div class="calendar-review-stage" role="dialog" aria-modal="true" aria-label="日期回看">
          <header class="calendar-review-head">
            <p id="calendarReviewDate">回看</p>
            <button id="closeCalendarReview" class="icon-button" type="button" aria-label="关闭日期回看">×</button>
          </header>
          <div id="calendarReviewDeck" class="review-deck" aria-label="日期卡牌"></div>
          <section id="calendarReviewDetail" class="review-detail" aria-live="polite"></section>
        </div>
      </section>

      <section class="weather-review" id="weatherReview" aria-hidden="true">
        <div class="weather-review-scrim" id="weatherReviewScrim"></div>
        <div class="weather-review-stage" role="dialog" aria-modal="true" aria-label="漂来的碎片">
          <header class="weather-review-head">
            <div>
              <p class="weather-kicker">最近海面似乎常漂来这些碎片</p>
              <h2 id="weatherReviewTitle">这些词最近轻轻聚在一起了</h2>
            </div>
            <button id="closeWeatherReview" class="icon-button" type="button" aria-label="关闭漂来的碎片">×</button>
          </header>
          <div class="weather-window-switch" role="group" aria-label="漂来的时间">
            <button class="weather-window-option active" data-days="30" type="button">近 30 日</button>
            <button class="weather-window-option" data-days="7" type="button">近 7 日</button>
          </div>
          <p id="weatherReviewCopy" class="weather-review-copy">有些感觉似乎还停留在这里</p>
          <div id="weatherReviewDeck" class="weather-review-deck" aria-label="曾经靠近过它的片刻"></div>
          <section id="weatherReviewDetail" class="weather-review-detail" aria-live="polite"></section>
        </div>
      </section>

      <section class="card-modal" id="cardModal" aria-hidden="true">
        <div class="modal-scrim" id="modalScrim"></div>
        <div class="modal-stage" role="dialog" aria-modal="true" aria-label="卡牌回应">
          <button id="closeModal" class="icon-button close-modal" type="button" aria-label="关闭">×</button>
          <button id="prevCard" class="icon-button batch-nav batch-prev" type="button" aria-label="上一张">‹</button>
          <button id="nextCard" class="icon-button batch-nav batch-next" type="button" aria-label="下一张">›</button>
          <canvas id="focusCard" width="512" height="680" aria-hidden="true"></canvas>
          <div id="promptLayer" class="prompt-layer"></div>
          <div id="responseDock" class="response-dock">
            <div id="liveTagResult" class="tag-result"></div>
            <textarea id="answerInput" placeholder="一个词、一句话、一个画面都可以。"></textarea>
            <button id="submitAnswer" class="primary-button" type="button">提交</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
