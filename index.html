<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Presence</title>
  </head>
  <body>
    <main id="app" aria-label="Presence infinite canvas">
      <div id="sceneRoot" aria-hidden="true"></div>

      <header class="mobile-frame">
        <p class="brand">Presence</p>
        <nav class="top-actions" aria-label="工具">
          <button id="introGuideToggle" class="icon-button help-button" type="button" aria-label="轻提示">
            <span aria-hidden="true">?</span>
          </button>
          <button id="calendarToggle" class="icon-button" type="button" aria-label="日历">
            <span class="calendar-icon" aria-hidden="true"></span>
          </button>
          <button id="cardSetToggle" class="icon-button settings-button" type="button" aria-label="设置">
            <span class="settings-icon" aria-hidden="true"></span>
          </button>
        </nav>
      </header>

      <aside class="side-panel" id="cardSetPanel" aria-hidden="true">
        <div class="panel-head">
          <p class="panel-title">设置</p>
          <button id="closeCardSetPanel" class="icon-button" type="button" aria-label="关闭设置">×</button>
        </div>
        <input id="photoInput" class="visually-hidden" type="file" accept="image/*" capture="environment" multiple />
        <div id="cardSetList" class="set-list"></div>
      </aside>

      <aside class="side-panel calendar-panel" id="calendarPanel" aria-hidden="true">
        <div id="calendarList" class="calendar-list"></div>
      </aside>

      <section class="calendar-review" id="calendarReview" aria-hidden="true">
        <div class="calendar-review-scrim" id="calendarReviewScrim"></div>
        <div class="calendar-review-stage" role="dialog" aria-modal="true" aria-label="日期回看">
          <header class="calendar-review-head">
            <span class="review-calendar-mark" aria-hidden="true"><span class="calendar-icon"></span></span>
            <p id="calendarReviewDate">回看</p>
            <button id="closeCalendarReview" class="icon-button" type="button" aria-label="关闭日期回看">×</button>
          </header>
          <div id="calendarReviewDeck" class="review-deck" aria-label="日期卡牌"></div>
          <section id="calendarReviewDetail" class="review-detail" aria-live="polite"></section>
        </div>
      </section>

      <section class="card-modal" id="cardModal" aria-hidden="true">
        <div class="modal-scrim" id="modalScrim"></div>
        <div class="modal-stage" role="dialog" aria-modal="true" aria-label="卡牌回应">
          <button id="closeModal" class="icon-button close-modal" type="button" aria-label="回到画布">←</button>
          <p id="modalCloseHint" class="modal-close-hint">关闭窗口后可在日历中查看卡牌和你的回应</p>
          <button id="prevCard" class="icon-button batch-nav batch-prev" type="button" aria-label="上一张">‹</button>
          <button id="nextCard" class="icon-button batch-nav batch-next" type="button" aria-label="下一张">›</button>
          <canvas id="focusCard" width="512" height="680" aria-hidden="true"></canvas>
          <div id="promptLayer" class="prompt-layer"></div>
          <div id="responseDock" class="response-dock"></div>
        </div>
      </section>

      <div id="introWhisper" class="intro-whisper" aria-live="polite"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
